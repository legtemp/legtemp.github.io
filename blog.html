<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | LegionOS</title>
    <link rel="icon" type="image/png" href="img/favicon.png">

    <!-- SEO & Social Meta Tags -->
    <meta name="description"
        content="LegionOS Blog - Read the latest developer insights, changelogs, and announcements for LegionOS.">
    <meta property="og:title" content="LegionOS Blog">
    <meta property="og:description"
        content="LegionOS Blog - Read the latest developer insights, changelogs, and announcements for LegionOS.">
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/74641975?s=200&v=4">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top glass-nav">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
                <img src="img/navbar-logo.png" alt="L" class="brand-logo">EGION<span>OS</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
                <a href="index.html" class="nav-link me-4 d-none d-md-block theme-text">Home</a>
                <a href="index.html#screenshots" class="nav-link me-4 d-none d-md-block theme-text">Screenshots</a>
                <a href="index.html#features" class="nav-link me-4 d-none d-md-block theme-text">Features</a>
                <a href="index.html#team" class="nav-link me-4 d-none d-md-block theme-text">Team</a>
                <a href="blog.html" class="nav-link me-4 d-none d-md-block theme-text active">Blog</a>
                <a href="download.html" class="btn btn-primary rounded-pill px-4">Download</a>
            </div>
        </div>
    </nav>

    <header class="download-hero text-center d-flex align-items-center justify-content-center"
        style="min-height: 40vh; padding-top: 120px;">
        <div class="container">
            <h1 class="display-4 fw-bold hero-title">LegionOS Blogs</h1>
            <p class="lead hero-subtitle text-secondary">Discover updates, developer insights, and announcements.</p>
        </div>
    </header>

    <section class="py-5">
        <div class="container py-4">

            <!-- Filters -->
            <div class="d-flex flex-wrap justify-content-center gap-3 mb-5" id="blog-filters"
                style="opacity: 0; transform: translateY(20px);">
                <button class="filter-pill active" data-filter="all">All Posts</button>
                <button class="filter-pill" data-filter="developer">Developer Blog</button>
                <button class="filter-pill" data-filter="changelog">Changelogs</button>
            </div>

            <!-- Blog Grid / Single Post -->
            <div class="row justify-content-center" id="blog-container">
                <div class="col-12" id="markdown-content">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="text-secondary mt-3">Fetching content...</p>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <footer class="site-footer py-5 text-center mt-5">
        <div class="container pb-3 border-bottom border-dark">
            <h4 class="fw-bold mb-4 d-flex align-items-center justify-content-center">
                <img src="img/navbar-logo.png" alt="L" class="brand-logo"
                    style="height: 1.5em; margin-right: 4px;">EGION<span class="text-primary">OS</span>
            </h4>
            <div class="d-flex justify-content-center gap-4 mb-4 footer-links">
                <a href="https://github.com/Project-LegionOS" class="text-decoration-none" target="_blank">GitHub</a>
                <a href="https://t.me/legionos" class="text-decoration-none" target="_blank">Telegram</a>
                <a href="blog.html" class="text-decoration-none active">Blog</a>
            </div>
        </div>
        <div class="container pt-4">
            <p class="text-secondary small mb-0">&copy; 2026 LegionOS. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>

    <!-- Specific Blog Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const mdContent = document.getElementById("markdown-content");
            const filterContainer = document.getElementById("blog-filters");

            const urlParams = new URLSearchParams(window.location.search);
            const postFile = urlParams.get('post');

            if (postFile) {
                // Hide filters when reading a single post
                filterContainer.style.display = 'none';

                // Ensure we fetch from the external GitHub repo if it's just a filename
                const fetchUrl = postFile.startsWith('http')
                    ? postFile
                    : `https://raw.githubusercontent.com/legtemp/blogposts/refs/heads/main/${postFile}`;

                fetch(fetchUrl)
                    .then(response => {
                        if (!response.ok) throw new Error("Blog post not found in the external repository.");
                        return response.text();
                    })
                    .then(text => {
                        mdContent.innerHTML = `
                            <div class="feature-card p-4 p-md-5" style="opacity: 0; transform: translateY(30px);" id="single-post-card">
                                <div class="glow"></div>
                                <div class="position-relative z-1">
                                    <a href="blog.html" class="btn btn-outline-light btn-sm mb-4">&larr; Back to posts</a>
                                    ${marked.parse(text)}
                                </div>
                            </div>
                        `;
                        gsap.to("#single-post-card", { duration: 1, opacity: 1, y: 0, ease: "power3.out" });

                        // Re-attach glow effect specifically for the single post card
                        const card = document.getElementById('single-post-card');
                        card.addEventListener('mousemove', (e) => {
                            const rect = card.getBoundingClientRect();
                            const x = e.clientX - rect.left;
                            const y = e.clientY - rect.top;
                            card.style.setProperty('--mouse-x', `${x}px`);
                            card.style.setProperty('--mouse-y', `${y}px`);
                        });
                    })
                    .catch(error => {
                        mdContent.innerHTML = `
                            <div class="text-center py-5">
                                <h3 class="text-danger">Error</h3>
                                <p class="text-secondary">${error.message}</p>
                                <a href="blog.html" class="btn btn-outline-light mt-4">Back to Blog</a>
                            </div>`;
                    });
            } else {
                gsap.to(filterContainer, { duration: 0.8, opacity: 1, y: 0, ease: "power2.out" });
                let allBlogs = [];

                fetch('https://raw.githubusercontent.com/legtemp/blogposts/refs/heads/main/blogs.json')
                    .then(response => response.json())
                    .then(blogs => {
                        allBlogs = blogs;
                        renderCards('all'); // Initial render
                    })
                    .catch(error => {
                        mdContent.innerHTML = `<h3 class="text-danger text-center">Error</h3><p class="text-secondary text-center">Could not load blog list.</p>`;
                    });

                // Filter Logic
                const filterBtns = document.querySelectorAll('.filter-pill');
                filterBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        filterBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        const filterType = btn.getAttribute('data-filter');
                        renderCards(filterType);
                    });
                });

                function renderCards(filterType) {
                    mdContent.innerHTML = '<div class="row g-4" id="blog-grid"></div>';
                    const grid = document.getElementById('blog-grid');

                    const filteredBlogs = filterType === 'all'
                        ? allBlogs
                        : allBlogs.filter(blog => blog.type === filterType);

                    if (filteredBlogs.length === 0) {
                        grid.innerHTML = '<div class="col-12 text-center py-5"><p class="text-secondary">No posts found for this category.</p></div>';
                        return;
                    }

                    filteredBlogs.forEach((blog, index) => {
                        const badgeClass = blog.type === 'developer' ? 'badge-developer' : 'badge-changelog';
                        const badgeText = blog.type === 'developer' ? 'Developer' : 'Changelog';

                        // Parse date nicely
                        const dateObj = new Date(blog.date);
                        const formattedDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                        grid.insertAdjacentHTML('beforeend', `
                            <div class="col-12 col-md-6 col-lg-4 blog-item" style="opacity: 0; transform: translateY(30px);">
                                <a href="blog.html?post=${blog.file}" class="text-decoration-none">
                                    <div class="blog-card">
                                        <span class="blog-badge ${badgeClass}">${badgeText}</span>
                                        <div class="mt-4 mb-3 text-secondary d-flex align-items-center gap-2">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calendar3" viewBox="0 0 16 16">
                                                <path d="M14 0H2a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zM1 3.857C1 3.384 1.448 3 2 3h12c.552 0 1 .384 1 .857v10.286c0 .473-.448.857-1 .857H2c-.552 0-1-.384-1-.857V3.857z"/>
                                                <path d="M6.5 7a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-9 3a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-9 3a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
                                            </svg>
                                            <small>${formattedDate}</small>
                                        </div>
                                        <h4 class="fw-bold theme-text mb-2">${blog.title}</h4>
                                        <p class="text-secondary mb-0" style="font-size: 0.95rem;">${blog.subtitle}</p>
                                    </div>
                                </a>
                            </div>
                        `);
                    });

                    // Stagger animation for the new cards
                    gsap.to(".blog-item", {
                        duration: 0.8,
                        opacity: 1,
                        y: 0,
                        stagger: 0.1,
                        ease: "power2.out"
                    });
                }
            }
        });
    </script>
</body>

</html>
