<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download LegionOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top glass-nav">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">LEGION<span>OS</span></a>
            <div class="ms-auto d-flex align-items-center">
                <a href="index.html" class="nav-link me-4 d-none d-md-block theme-text">Home</a>
                <a href="index.html#screenshots" class="nav-link me-4 d-none d-md-block theme-text">Screenshots</a>
                <a href="index.html#features" class="nav-link me-4 d-none d-md-block theme-text">Features</a>
                <a href="index.html#team" class="nav-link me-4 d-none d-md-block theme-text">Team</a>
                <a href="blog.html" class="nav-link me-4 d-none d-md-block theme-text">Blog</a>
                <a href="download.html" class="btn btn-primary rounded-pill px-4">Download</a>
            </div>
        </div>
    </nav>

    <header class="download-hero text-center d-flex align-items-center justify-content-center">
        <div class="container">
            <h1 class="display-3 fw-bold hero-title">Get LegionOS</h1>
            <p class="lead hero-subtitle text-secondary">Find the latest official builds for your device.</p>

            <div class="search-container mt-5 mx-auto" style="max-width: 600px;">
                <input type="text" id="deviceSearch" class="form-control form-control-lg glass-input rounded-pill px-4"
                    placeholder="🔍 Search device (e.g. sweet, alioth)...">
            </div>
        </div>
    </header>

    <section class="py-5" id="devices-section">
        <div class="container py-4">
            <div class="row g-4" id="deviceList">
                <!-- Devices will be dynamically loaded here from devices.json -->
            </div>

            <div id="noResults" class="text-center py-5 d-none">
                <h3 class="text-secondary mt-4">No devices found.</h3>
                <p class="text-secondary">Try searching with a different codename or model.</p>
            </div>
        </div>
    </section>

    <footer class="site-footer py-5 text-center">
        <div class="container pb-3 border-bottom border-dark">
            <h4 class="fw-bold mb-4">LEGION<span class="text-primary">OS</span></h4>
            <div class="d-flex justify-content-center gap-4 mb-4 footer-links">
                <a href="https://github.com/Project-LegionOS" class="text-decoration-none" target="_blank">GitHub</a>
                <a href="https://t.me/legionos" class="text-decoration-none" target="_blank">Telegram</a>
                <a href="blog.html" class="text-decoration-none">Blog</a>
            </div>
        </div>
        <div class="container pt-4">
            <p class="text-secondary small mb-0">&copy; 2026 LegionOS. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
